<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lessons — Literacy Program</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --beige: #FAF7F2;
      --ink: #1A1A18;
      --lavender: #87677B;
      --pink: #FFCAD4;
      --emerald: #003800;
      --celadon: #BBDBB4;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--beige); color: var(--ink); line-height: 1.7; }

    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.25rem 2.5rem; border-bottom: 1px solid var(--emerald);
      background: var(--emerald); position: sticky; top: 0; z-index: 100;
    }
    .nav-logo { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700; text-decoration: none; color: var(--beige); }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { text-decoration: none; color: var(--celadon); font-size: 0.9rem; font-weight: 500; letter-spacing: 0.02em; transition: color 0.2s; }
    .nav-links a:hover { color: var(--beige); }
    .nav-links a.active { color: var(--beige); }

    .page-header {
      padding: 5rem 2.5rem 3rem;
      max-width: 900px; margin: 0 auto;
    }
    .section-label { font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--celadon); font-weight: 500; margin-bottom: 0.5rem; }
    .page-header h1 { font-family: 'Playfair Display', serif; font-size: 2.8rem; font-weight: 700; margin-bottom: 0.75rem; }
    .page-header p { color: var(--muted); font-weight: 300; max-width: 480px; }

    /* FILTERS */
    .filters {
      max-width: 900px; margin: 0 auto;
      padding: 0 2.5rem 2rem;
      display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center;
    }
    .filter-label { font-size: 0.85rem; color: var(--muted); margin-right: 0.25rem; }
    .filter-btn {
      background: transparent; border: 1px solid var(--border);
      padding: 0.4rem 1rem; border-radius: 2rem;
      font-size: 0.85rem; cursor: pointer; font-family: 'DM Sans', sans-serif;
      color: var(--muted); transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active { background: var(--ink); color: var(--beige); border-color: var(--ink); }

    /* SEARCH */
    .search-wrap { max-width: 900px; margin: 0 auto; padding: 0 2.5rem 2.5rem; }
    .search-input {
      width: 100%; max-width: 420px;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 3px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      background: white;
      color: var(--ink);
      outline: none;
    }
    .search-input:focus { border-color: var(--gold); }

    /* GRID */
    .lessons-grid {
      max-width: 900px; margin: 0 auto;
      padding: 0 2.5rem 5rem;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .lesson-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.75rem;
      display: flex; flex-direction: column;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }
    .lesson-card:hover { border-color: var(--celadon); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.07); }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
    .level-badge {
      font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
      font-weight: 500; padding: 0.25rem 0.65rem; border-radius: 2rem;
    }
    .level-beginner { background: #E8F5E9; color: #2E7D32; }
    .level-intermediate { background: #FFF8E1; color: #F57F17; }
    .level-advanced { background: #E8EAF6; color: #283593; }

    .lesson-month { font-size: 0.75rem; color: var(--muted); }

    .lesson-card h3 { font-family: 'Playfair Display', serif; font-size: 1.2rem; margin-bottom: 0.5rem; line-height: 1.3; }
    .lesson-card p { font-size: 0.875rem; color: var(--muted); font-weight: 300; flex: 1; }

    .card-footer { margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .card-duration { font-size: 0.8rem; color: var(--muted); }
    .card-link { font-size: 0.8rem; color: var(--gold); font-weight: 500; text-decoration: none; letter-spacing: 0.04em; }
    .card-link:hover { text-decoration: underline; }

    .no-results { grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--muted); font-style: italic; }

    footer { padding: 2.5rem; border-top: 1px solid var(--emerald); display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--emerald); }

    @media (max-width: 650px) {
      nav { padding: 1rem 1.25rem; }
      .nav-links { gap: 1rem; }
      .page-header, .filters, .search-wrap, .lessons-grid { padding-left: 1.25rem; padding-right: 1.25rem; }
      footer { flex-direction: column; gap: 1rem; text-align: center; }
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-logo" href="index.html">Lit&period; Program</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="lessons.html" class="active">Lessons</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>

  <div class="page-header">
    <p class="section-label">Lesson library</p>
    <h1>All Lessons</h1>
    <p>Browse our growing library. A new lesson is added every month — all free, forever.</p>
  </div>

  <div class="search-wrap">
    <input class="search-input" type="text" id="search" placeholder="Search lessons..." />
  </div>

  <div class="filters">
    <span class="filter-label">Filter:</span>
    <button class="filter-btn active" data-filter="all">All levels</button>
    <button class="filter-btn" data-filter="beginner">Beginner</button>
    <button class="filter-btn" data-filter="intermediate">Intermediate</button>
    <button class="filter-btn" data-filter="advanced">Advanced</button>
  </div>

  <div class="lessons-grid" id="lessons-grid">
    <!-- Cards injected by JS -->
  </div>

  <footer>
    <span>© 2025 Literacy Program. Nonprofit organization.</span>
    <span>Made with care &amp; zero budget 🤍</span>
  </footer>

  <script>
    const LESSONS = [
      { level: "beginner", month: "January 2025", title: "Alphabet Foundations", desc: "Letter recognition, phonics basics, and building your first words from scratch.", duration: "30 min" },
      { level: "beginner", month: "February 2025", title: "Vowel Sounds", desc: "Short and long vowel sounds with practice words and simple exercises.", duration: "25 min" },
      { level: "intermediate", month: "March 2025", title: "Sight Words & Fluency", desc: "The 100 most common words and techniques to recognize them instantly.", duration: "35 min" },
      { level: "beginner", month: "April 2025", title: "Consonant Blends", desc: "Blending consonants together to form more complex words and sounds.", duration: "30 min" },
      { level: "advanced", month: "May 2025", title: "Reading Comprehension", desc: "Strategies for understanding, summarizing, and engaging deeply with any text.", duration: "45 min" },
      { level: "intermediate", month: "June 2025", title: "Sentence Building", desc: "How simple sentences are structured and how to build complexity over time.", duration: "40 min" },
    ];

    let activeFilter = "all";
    let searchQuery = "";

    function renderCards() {
      const grid = document.getElementById("lessons-grid");
      const filtered = LESSONS.filter(l => {
        const matchLevel = activeFilter === "all" || l.level === activeFilter;
        const matchSearch = l.title.toLowerCase().includes(searchQuery) || l.desc.toLowerCase().includes(searchQuery);
        return matchLevel && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<p class="no-results">No lessons found. Try a different search or filter.</p>';
        return;
      }

      grid.innerHTML = filtered.map(l => `
        <div class="lesson-card">
          <div class="card-top">
            <span class="level-badge level-${l.level}">${l.level}</span>
            <span class="lesson-month">${l.month}</span>
          </div>
          <h3>${l.title}</h3>
          <p>${l.desc}</p>
          <div class="card-footer">
            <span class="card-duration">${l.duration}</span>
            <a href="#" class="card-link">Start lesson →</a>
          </div>
        </div>
      `).join("");
    }

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        renderCards();
      });
    });

    document.getElementById("search").addEventListener("input", e => {
      searchQuery = e.target.value.toLowerCase();
      renderCards();
    });

    renderCards();
  </script>
</body>
</html>
